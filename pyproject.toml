[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "port-energy-dt-ops-assistant"
version = "0.1.0"
description = "A solo capstone project for Port Energy Digital Twin Ops Assistant"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "jinja2",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
